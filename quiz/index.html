<title>Quiz Talent Unique : découvre ce qui te rend rare | Magic Humans</title>

<style>
/* Layout : une colonne de lecture (~720px), écrans successifs : accueil → 6 questions → départage → 3 questions de ressourcement → rapport en 7 sections */
:root{
  --bg:#F5F3F0; --surface:#FFFFFF; --ink:#2B2522; --muted:#6E645D; --line:#E4DED7;
  --accent:#D9661C; --accent-ink:#FFFFFF; --accent-soft:#FBE8D8;
  --good:#3C7A55; --good-soft:#E3F0E7; --bad:#B0463A; --bad-soft:#F6E2DE;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:14px;
  --cc-bg:var(--surface); --cc-ink:var(--ink); --cc-muted:var(--muted); --cc-line:var(--line); --cc-accent:var(--accent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1816; --surface:#25211E; --ink:#F1ECE6; --muted:#ABA097; --line:#3A332E;
  --accent:#F08A3E; --accent-ink:#1B1816; --accent-soft:#3A2618;
  --good:#7CC59A; --good-soft:#1F3328; --bad:#E58B7E; --bad-soft:#3A2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1816; --surface:#25211E; --ink:#F1ECE6; --muted:#ABA097; --line:#3A332E;
  --accent:#F08A3E; --accent-ink:#1B1816; --accent-soft:#3A2618;
  --good:#7CC59A; --good-soft:#1F3328; --bad:#E58B7E; --bad-soft:#3A2220; color-scheme:dark}

.mh-cookie-banner{position:fixed;left:0;right:0;bottom:0;z-index:300;background:var(--cc-bg);border-top:1px solid var(--cc-line);box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.mh-cookie-banner[hidden]{display:none}
.mh-cookie-banner__inner{max-width:740px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mh-cookie-banner__text{flex:1 1 280px;margin:0;font-size:.85rem;line-height:1.5;color:var(--cc-ink)}
.mh-cookie-banner__link{color:var(--cc-accent);text-decoration:underline;border-bottom:none}
.mh-cookie-banner__actions{display:flex;gap:10px;flex-shrink:0}
.mh-cookie-banner__btn{font:inherit;font-size:.82rem;font-weight:700;padding:10px 22px;border-radius:999px;border:1px solid var(--cc-ink);background:transparent;color:var(--cc-ink);cursor:pointer;white-space:nowrap}
.mh-cookie-banner__btn:hover{background:var(--cc-ink);color:var(--cc-bg)}
body.mh-cookie-open{padding-bottom:var(--mh-cookie-banner-h,190px)}
@media (max-width:600px){.mh-cookie-banner__inner{padding:10px 14px;gap:8px}.mh-cookie-banner__text{font-size:.72rem;line-height:1.4}.mh-cookie-banner__actions{width:100%}.mh-cookie-banner__btn{flex:1 1 0;text-align:center;padding:8px 14px;font-size:.72rem}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
.wrap{max-width:740px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.3rem,6vw,3.3rem)}
h2{font-size:clamp(1.7rem,4.5vw,2.2rem)}
h3{font-size:1.4rem}
p{margin:0}
em.serif{font-family:var(--display);font-style:italic;font-size:1.15em}
.brand{display:flex;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
.eyebrow{font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 26px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s, opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 16px;font-size:.88rem}
.link{background:none;border:0;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Accueil */
.hero{padding-block:40px 8px;display:flex;flex-direction:column;gap:18px}
.hero p.lead{font-size:1.18rem;max-width:60ch}
.formula{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.2rem);font-style:italic;display:flex;flex-wrap:wrap;gap:.35em;align-items:baseline}
.formula b{font-style:normal;color:var(--accent);font-weight:600}
.howto{display:flex;flex-direction:column;gap:14px}
.howto-title{font-size:clamp(1.55rem,4.2vw,2rem)}
.howto-tip{color:var(--muted);max-width:60ch}
.hello{display:flex;flex-direction:column;gap:14px;max-width:520px}
.invited{background:var(--accent-soft);border-radius:var(--radius);padding:12px 16px;margin:0}
.animal{margin:0;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rule .k{font-family:var(--display);font-size:1.6rem;color:var(--accent);font-weight:600;line-height:1}
.rule p{font-size:.93rem;color:var(--muted)}

/* Questionnaire */
.progress{display:flex;gap:6px}
.progress span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.progress span.done{background:var(--accent)}
.qhead{display:flex;flex-direction:column;gap:8px;padding-block:22px 6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.legend b{color:var(--ink)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 18px;transition:border-color .15s, background .15s}
.item.is-plus{border-color:var(--accent);background:var(--accent-soft)}
.item.is-minus .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.item .txt{min-width:0}
.choices{display:flex;gap:8px}
.choice{font:inherit;font-weight:700;width:58px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:1.15rem}
.choice small{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.choice[aria-pressed="true"].plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice[aria-pressed="true"].plus small{color:var(--accent-ink)}
.choice[aria-pressed="true"].minus{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.choice[aria-pressed="true"].minus small{color:var(--bg)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:18px}
.hint{font-size:.88rem;color:var(--muted);min-height:1.4em}

/* Départage */
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cand{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.cand .rank{position:absolute;top:12px;right:14px;font-family:var(--display);font-size:1.5rem;color:var(--accent);font-weight:600}
.cand.picked{border-color:var(--accent);background:var(--accent-soft)}
.cand span.t{font-size:.82rem;color:var(--muted)}

/* Ressourcement */
.rsrc-q{display:flex;flex-direction:column;gap:10px}
.rsrc-q .qstem{font-family:var(--display);font-weight:600;font-size:1.2rem}
.rsrc-opt{font:inherit;display:block;width:100%;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;cursor:pointer}
.rsrc-opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.rsrc-note{font-size:.93rem;margin-top:-4px}
.recharge h3{font-size:1.5rem}

/* Rapport */
.rhead{padding-block:34px 10px;display:flex;flex-direction:column;gap:12px}
.alloy{font-family:var(--display);font-size:clamp(2.6rem,8vw,4rem);line-height:1;font-weight:600}
.alloy em{color:var(--accent);font-weight:500}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.toc a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.toc a:hover{color:var(--accent)}
section.rs{border-top:1px solid var(--line);padding-top:30px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:16px}
.snum{font-family:var(--display);font-style:italic;color:var(--accent);font-size:1.15rem}
.prose{max-width:64ch;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:1.3rem}
.panel .lab{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.equation{background:var(--accent-soft);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.chart{display:flex;flex-direction:column;gap:7px;font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:.9rem}
.bar-track{position:relative;height:14px;background:var(--bg);border-radius:4px}
.bar-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.bar{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--line)}
.bar.top{background:var(--accent)}
.bar.axis{background:var(--muted);opacity:.55}
.bar-row .v{text-align:right;color:var(--muted)}
.bar-row .n.top{font-weight:700}
.chart-scale{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;font-size:.72rem;color:var(--muted)}
.chart-scale div{display:flex;justify-content:space-between}
.ship{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.ship .panel{border-top:3px solid var(--accent)}
.ship .panel.sail{border-top-color:var(--muted)}
.ship .panel.comp{border-top-color:var(--ink)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.ctx-good{background:var(--good-soft);border:1px solid transparent}
.ctx-good .lab{color:var(--good)}
.ctx-bad{background:var(--bad-soft);border:1px solid transparent}
.ctx-bad .lab{color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.dot.g{background:var(--good)} .dot.r{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;background:var(--surface)}
.quote{font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.35}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;width:100%;min-height:210px;resize:vertical;line-height:1.55}
.manual{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 24px;display:flex;flex-direction:column;gap:14px}
.manual dt{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.manual dd{margin:2px 0 0}
.manual dl{margin:0;display:flex;flex-direction:column;gap:14px}
.row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{font-size:.85rem;color:var(--good)}
.slider{display:flex;flex-direction:column;gap:6px}
.slider label{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.slider output{font-family:var(--display);font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.reading{border-left:3px solid var(--accent);padding-left:14px}
.cta{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.cta h3{font-size:1.8rem}
.cta .btn{align-self:flex-start}
.cta-actions{display:flex;flex-wrap:wrap;gap:10px}
.share{gap:14px}
.share-row{display:flex;flex-direction:column;gap:8px}
.share-row p{margin:0}
.share a.btn{text-decoration:none}
.cta .btn.alt{background:transparent;color:var(--bg);border:1px solid var(--bg)}
.cta .btn.alt:hover{background:var(--bg);color:var(--ink)}
.cta p{color:var(--bg);opacity:.85}
details{font-size:.93rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
details div{padding-top:8px;display:flex;flex-direction:column;gap:8px}
footer{padding-top:40px;font-size:.82rem;color:var(--muted);text-align:center}
@media (max-width:520px){
  .item{grid-template-columns:1fr;gap:10px}
  .choices{justify-content:flex-end}
  .bar-row,.chart-scale{grid-template-columns:86px 1fr 28px}
  .wrap{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Capture e-mail */
.gate{display:flex;flex-direction:column;gap:22px;padding-block:30px 0}
.optin{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.optin summary{cursor:pointer;font-weight:700;color:var(--ink)}
.optin[open] summary{margin-bottom:10px}
.optin p{margin:0 0 12px;color:var(--muted)}
.optin #gate-slot form{border:0;padding:0;background:transparent}
.rs.unlock{border-top:0;background:var(--accent-soft);border-radius:var(--radius);padding:26px 22px}
.rs.unlock ul.clean{margin:0}
#gate-slot form,.gate form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.9rem}
.check input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.legal{font-size:.8rem;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}
/* Barre d'actions du rapport */
.actions{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.actions .row-actions{gap:8px}
.status{font-size:.88rem;color:var(--muted)}
.status.ok{color:var(--good)} .status.ko{color:var(--bad)}
/* Barre du haut et sélecteur de langue */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qlang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.qlang button{font:inherit;font-size:.75rem;font-weight:700;letter-spacing:.06em;border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;min-height:32px}
.qlang button.active{background:var(--ink);color:var(--bg)}
</style>

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="/" style="text-decoration:none"><i></i><span data-t="brand"></span></a>
    <div class="qlang" role="group" aria-label="Langue / Language">
      <button type="button" data-setlang="fr">FR</button>
      <button type="button" data-setlang="en">EN</button>
      <button type="button" data-setlang="es">ES</button>
    </div>
  </div>

  <main id="screen-intro">
    <div class="hero">
      <span class="eyebrow" data-t="intro.eyebrow"></span>
      <h1 data-t="intro.h1"></h1>
      <p class="lead" data-t="intro.lead"></p>
      <div class="formula" data-t="intro.formula"></div>
    </div>
    <div class="stack-lg" style="padding-top:18px">
      <div class="howto">
        <h2 class="howto-title" data-t="intro.rulesTitle"></h2>
        <div class="rules" id="rules"></div>
        <p class="howto-tip" data-t="intro.rulesTip"></p>
      </div>
      <div class="hello">
        <p class="invited" id="invited" hidden></p>
        <div class="field"><label for="h-prenom" data-t="intro.nameLabel"></label><input id="h-prenom" autocomplete="given-name" maxlength="40"></div>
        <div class="field"><label for="h-animal" data-t="intro.animalLabel"></label><input id="h-animal" maxlength="40"></div>
        <p class="err" id="h-err" aria-live="polite"></p>
      </div>
      <div class="row-actions">
        <button class="btn" id="start" data-t="intro.start"></button>
        <button class="link" id="demo" data-t="intro.demo"></button>
      </div>
    </div>
  </main>

  <main id="screen-quiz" hidden>
    <div class="progress" id="progress"></div>
    <div class="qhead">
      <span class="eyebrow" id="qcount"></span>
      <h2 id="qstem"></h2>
      <div class="legend"><span data-t="quiz.legendPlus"></span><span data-t="quiz.legendMinus"></span></div>
    </div>
    <div class="items" id="items"></div>
    <div class="qnav">
      <button class="btn ghost" id="prev" data-t="quiz.prev"></button>
      <span class="hint" id="hint"></span>
      <button class="btn" id="next" disabled></button>
    </div>
  </main>

  <main id="screen-tie" hidden>
    <div class="qhead">
      <span class="eyebrow" data-t="tie.eyebrow"></span>
      <h2 data-t="tie.h2"></h2>
      <p class="muted" id="tie-help"></p>
    </div>
    <div class="cands" id="cands"></div>
    <div class="qnav">
      <button class="btn ghost" id="tie-reset" data-t="tie.reset"></button>
      <button class="btn" id="tie-ok" disabled data-t="tie.ok"></button>
    </div>
  </main>

  <main id="screen-resources" hidden>
    <div class="qhead">
      <span class="eyebrow" data-t="resources.eyebrow"></span>
      <h2 data-t="resources.h2"></h2>
      <p class="muted" data-t="resources.lead"></p>
    </div>
    <div class="stack-lg" id="resource-questions" style="padding-top:18px"></div>
    <div class="qnav">
      <button class="btn ghost" id="resources-back" data-t="resources.back"></button>
      <span class="hint" id="resources-hint"></span>
      <button class="btn" id="resources-next" disabled data-t="resources.next"></button>
    </div>
  </main>

  <main id="screen-gate" hidden>
    <div class="gate">

  alloyName:p=>A_FR[p.D].name+" "+A_FR[p.S].adj,

  // Contenus combinés du rapport
  parts(p){
    const d=A_FR[p.D], s=A_FR[p.S], ax=A_FR[p.axis];
    const de = pole => { const x=pole.toLowerCase(); return x.startsWith("le ") ? "du "+x.slice(3) : "de "+x; };
    return {
      core: ALLOYS_FR[p.D+"_"+p.S],
      expansion: p.expansion.length
        ? "Ces archétypes arrivent juste après ton noyau. Ils peuvent correspondre à des compétences développées par l'expérience plutôt qu'à ta nature profonde. Demande-toi : est-ce que je le fais avec plaisir, ou parce que j'ai appris à le faire ?"
        : "Aucun autre archétype ne ressort nettement en positif. Tes voiles sont probablement ailleurs : dans les compétences et les pratiques acquises au fil de ton parcours. Liste trois choses que tu fais bien et que tu as apprises sur le terrain.",
      axis:`C'est ton archétype le moins marqué${p.axis===d.complement?`, et aussi le contrepoids naturel de ta dominante ${d.name}`:""}. Ce n'est pas un défaut à corriger, c'est une posture à emprunter : observe des personnes qui savent ${ax.inf} et modélise leur façon de faire, sans chercher à devenir elles.`,
      gift: cap(d.gift)+".",
      giftColor:`Ton secondaire ${s.name} lui donne sa couleur : tu le fais ${s.how}. C'est l'alliance ${de(d.pole)} et ${de(s.pole)} qui te rend difficile à remplacer.`,
      vuln:`Le revers de ta force, c'est ${d.vuln}.`,
      fracture:`Ton Talent Unique a aussi sa ligne de fracture : ton besoin ${d.need} peut entrer en collision avec ton besoin ${s.need}. Quand les deux tirent dans des directions opposées, tu peux te sentir divisé·e sans comprendre pourquoi.`,
      survivalAlt:`Variante liée à ton secondaire, le mode « ${s.survival.mode.toLowerCase()} » : ${lc1(s.survival.desc)}`,
      fertile:[...d.fertile, ...s.fertile.slice(0,2)],
      toxic:[...d.toxic, ...s.toxic.slice(0,2)],
      flow:[...d.flow, s.flow[0]],
      ressource:[...d.ressource, s.ressource[0]],   // repli pour les liens sans module de ressourcement
      recharge: rechargeOf(p, "fr"),
      client:`${d.targets.client}. Ton côté ${s.name} te rend aussi précieux·se pour ${lc1(s.targets.client)}.`,
      verbatims:[...d.verbatims, ...s.verbatims.slice(0,2)],
      keywords:[...d.keywords, ...s.keywords.slice(0,2)]
    };
  },

  pitch(p, prenom){
    const d=A_FR[p.D], s=A_FR[p.S];
    return `Je m'appelle ${cleanName(prenom)||"[Prénom]"}.
J'accompagne ${d.pitch.who} ${d.pitch.pain}. Mon rôle : les aider à ${d.pitch.result}.

Ma particularité : je combine deux forces rarement réunies, ${d.pole.toLowerCase()} et ${s.pole.toLowerCase()}. Concrètement, je sais ${d.inf}, et je le fais ${s.how}.

Si vous entendez autour de vous « ${d.verbatims[0]} » ou « ${s.verbatims[1]} », c'est exactement là que je suis utile. Parlons-en.`;
  },

  manualItems(p){
    const d=A_FR[p.D], s=A_FR[p.S];
    return [
      ["Ce que j'apporte", `Je sais ${d.inf}, et je le fais ${s.how}.`],
      ["Pour donner le meilleur", `J'ai besoin ${d.manual.besoin}, et ${s.manual.besoin}.`],
      ["Ce qui me donne de l'énergie", `${cap(d.manual.energie)} ; ${s.manual.energie}.`],
      ["Comment travailler avec moi", d.manual.parler],
      ["Ce qu'il vaut mieux éviter", d.manual.eviter],
      ["Mon signal d'alerte", `Sous forte pression, je peux basculer en mode « ${d.survival.mode.toLowerCase()} ». Si vous le remarquez, regardons ensemble le contexte plutôt que ma motivation.`]
    ];
  },
  manualHead(p){ return `MON MANUEL D'UTILISATION\nMon Talent Unique : ${this.alloyName(p)} (dominante ${A_FR[p.D].name}, secondaire ${A_FR[p.S].name})`; },

  readAlignment(v, p){
    const avg=(v.ctx+v.exp+v.fin)/3, lowest=Object.entries(v).sort((a,b)=>a[1]-b[1])[0][0];
    if (avg>=8) return "<strong>Alignement élevé.</strong> Ton talent semble bien exprimé dans un contexte qui lui convient. L'enjeu est maintenant de le faire rayonner plus loin : positionnement, visibilité, valeur perçue.";
    const msg={
      ctx:`<strong>Le contexte est ton premier levier.</strong> Avec ${v.ctx}/10, ton environnement ressemble peut-être davantage à un récif qu'à une mer porteuse. Compare-le à la liste « contexte toxique » de la section 4 : combien de points te parlent ?`,
      exp:`<strong>Ton talent est sous-exprimé.</strong> Avec ${v.exp}/10, tu passes probablement une bonne partie de ton temps hors de ta zone de flow. Quelle part de ta semaine consacres-tu vraiment à ${A_FR[p.D].inf} ?`,
      fin:`<strong>La reconnaissance ne suit pas.</strong> Avec ${v.fin}/10, la valeur que tu crées ne se traduit pas encore en reconnaissance ou en revenus. C'est souvent une question de positionnement et de langage : relis la section 5.`
    };
    return (avg<5?`Score moyen de ${avg.toFixed(1).replace(".",",")}/10 : l'écart entre ton potentiel et ta situation mérite qu'on s'y arrête. `:`Score moyen de ${avg.toFixed(1).replace(".",",")}/10. `)+msg[lowest];
  }
};

  // English word order: adjective first ("Empathic Builder")
  alloyName:p=>A_EN[p.S].adj+" "+A_EN[p.D].name,

  parts(p){
    const d=A_EN[p.D], s=A_EN[p.S], ax=A_EN[p.axis];
    return {
      core: ALLOYS_EN[p.D+"_"+p.S],
      expansion: p.expansion.length
        ? "These archetypes come right after your core. They may reflect skills developed through experience rather than your deeper nature. Ask yourself: do I do this with pleasure, or because I've learned to?"
        : "No other archetype stands out clearly. Your sails are probably elsewhere: in the skills and practices you've built along the way. List three things you do well that you learned on the job.",
      axis:`This is your least marked archetype${p.axis===d.complement?`, and also the natural counterweight to your dominant ${d.name}`:""}. It isn't a flaw to fix but a stance to borrow: watch people who know how to ${ax.inf} and model the way they do it, without trying to become them.`,
      gift: cap(d.gift)+".",
      giftColor:`Your secondary ${s.name} gives it its colour: you do it ${s.how}. It's the combination of ${d.pole.toLowerCase()} and ${s.pole.toLowerCase()} that makes you hard to replace.`,
      vuln:`The flip side of your strength is ${d.vuln}.`,
      fracture:`Your Unique Talent also has a fault line: your need ${d.need} can collide with your need ${s.need}. When the two pull in opposite directions, you can feel torn without understanding why.`,
      survivalAlt:`A variant linked to your secondary, the \"${s.survival.mode.toLowerCase()}\" mode: ${lc1(s.survival.desc)}`,
      fertile:[...d.fertile, ...s.fertile.slice(0,2)],
      toxic:[...d.toxic, ...s.toxic.slice(0,2)],
      flow:[...d.flow, s.flow[0]],
      ressource:[...d.ressource, s.ressource[0]],   // fallback for links without the recharge module
      recharge: rechargeOf(p, "en"),
      client:`${d.targets.client}. Your ${s.name} side also makes you valuable to ${lc1(s.targets.client)}.`,
      verbatims:[...d.verbatims, ...s.verbatims.slice(0,2)],
      keywords:[...d.keywords, ...s.keywords.slice(0,2)]
    };
  },

  pitch(p, prenom){
    const d=A_EN[p.D], s=A_EN[p.S];
    return `My name is ${cleanName(prenom)||"[First name]"}.
I work with ${d.pitch.who} ${d.pitch.pain}. My role: helping them ${d.pitch.result}.

What makes me different: I combine two strengths rarely found together, ${d.pole.toLowerCase()} and ${s.pole.toLowerCase()}. In practice, I know how to ${d.inf}, and I do it ${s.how}.

If you hear people around you say \"${d.verbatims[0]}\" or \"${s.verbatims[1]}\", that's exactly where I can help. Let's talk.`;
  },

  manualItems(p){
    const d=A_EN[p.D], s=A_EN[p.S];
    return [
      ["What I bring", `I know how to ${d.inf}, and I do it ${s.how}.`],
      ["To give my best", `I need ${d.manual.besoin}, and ${s.manual.besoin}.`],
      ["What energises me", `${cap(d.manual.energie)}; ${s.manual.energie}.`],
      ["How to work with me", d.manual.parler],
      ["What to avoid", d.manual.eviter],
      ["My warning sign", `Under heavy pressure, I can slip into \"${d.survival.mode.toLowerCase()}\" mode. If you notice it, let's look at the context together rather than my motivation.`]
    ];
  },
  manualHead(p){ return `MY USER MANUAL\nMy Unique Talent: ${this.alloyName(p)} (dominant ${A_EN[p.D].name}, secondary ${A_EN[p.S].name})`; },

  readAlignment(v, p){
    const avg=(v.ctx+v.exp+v.fin)/3, lowest=Object.entries(v).sort((a,b)=>a[1]-b[1])[0][0];
    if (avg>=8) return "<strong>Strong alignment.</strong> Your talent seems well expressed in a context that suits it. The next step is to make it shine further: positioning, visibility, perceived value.";
    const msg={
      ctx:`<strong>Context is your first lever.</strong> At ${v.ctx}/10, your environment may look more like a reef than a carrying sea. Compare it with the \"toxic context\" list in section 4: how many points ring true?`,
      exp:`<strong>Your talent is under-expressed.</strong> At ${v.exp}/10, you probably spend much of your time outside your flow zone. How much of your week do you really spend on the ability to ${A_EN[p.D].inf}?`,
      fin:`<strong>Recognition isn't following.</strong> At ${v.fin}/10, the value you create isn't yet turning into recognition or income. It's often a matter of positioning and language: reread section 5.`
    };
    return (avg<5?`Average score ${avg.toFixed(1)}/10: the gap between your potential and your situation is worth looking at. `:`Average score ${avg.toFixed(1)}/10. `)+msg[lowest];
  }
};

/* ---------- Calcul ---------- */
function computeScores(answers){
  const s = Object.fromEntries(IDS.map(id=>[id,{score:0,plus:0,minus:0}]));
  answers.forEach((a,qi)=>{
    if (a.plus!=null) s[QUESTION_IDS[qi][a.plus]].plus++;
    if (a.minus!=null) s[QUESTION_IDS[qi][a.minus]].minus++;
  });
  IDS.forEach(id=>{ s[id].score = s[id].plus*POINTS.plus + s[id].minus*POINTS.minus; });
  return s;
}
const sortByScore = (s, ids=IDS) => [...ids].sort((a,b)=>s[b].score-s[a].score);

function resolveCore(s){
  const groups = [];
  sortByScore(s).forEach(id=>{
    const g = groups[groups.length-1];
    if (g && s[g[0]].score===s[id].score) g.push(id); else groups.push([id]);
  });
  const fixed=[];
  for (const g of groups){
    if (fixed.length>=2) break;
    const slots = 2-fixed.length;
    if (g.length===1) fixed.push(g[0]);
    else return {fixed, candidates:g, need:Math.min(slots,g.length)};
  }
  return {fixed, candidates:null, need:0};
}

function buildProfile(s, core){
  const [D,S] = core;
  const rest = sortByScore(s).filter(id=>id!==D && id!==S);
  const expansion = rest.slice(0,2).filter(id=>s[id].score>0);
  const min = Math.min(...rest.map(id=>s[id].score));
  const lows = rest.filter(id=>s[id].score===min);
  const axis = lows.find(id=>id===COMPLEMENT[D]) || lows.find(id=>id===COMPLEMENT[S]) || lows[0];
  return {D,S,expansion,axis,scores:s,sorted:sortByScore(s)};
}

/* ---------- Outils ---------- */
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
const lc1 = t => t.charAt(0).toLowerCase()+t.slice(1);
function cleanName(n){ return String(n||"").replace(/[<>]/g,"").replace(/\s+/g," ").trim().slice(0,40); }
const L = lang => LANGS[lang] || LANGS.fr;
const alloyName = (p, lang) => L(lang).X.alloyName(p);

/* ---------- Lien personnel ----------
   Format : réponses (12 chiffres) . dominant . secondaire . langue . ressourcement (optionnel, « r » + 3 chiffres) . prénom
   (les anciens liens sans langue ni ressourcement restent lisibles, en français ;
   les liens de la première version du module, 3 chiffres sans « r », sont lus sans ressourcement) */
function encodeState(answers, core, prenom, lang, resourceIdx){
  const a = answers.map(x=>""+x.plus+x.minus).join("");
  const parts = [a, core[0], core[1], (lang==="en"||lang==="es"?lang:"fr")];
  if (resourceIdx && resourceIdx.length===RESOURCE_QUESTIONS_FR.length && resourceIdx.every(x=>x!=null)) parts.push("r"+resourceIdx.join(""));
  parts.push(encodeURIComponent(cleanName(prenom)));
  return parts.join(".");
}
function decodeState(str){
  try{
    const parts = String(str).split(".");
    if (parts.length < 3) return null;
    const [a, D, S] = parts;
    let lang = "fr", rest = parts.slice(3);
    if (rest[0]==="fr" || rest[0]==="en" || rest[0]==="es"){ lang = rest[0]; rest = rest.slice(1); }
    let resourceIdx = null;
    if (rest.length>1 && /^r[0-3]{3}$/.test(rest[0])){ resourceIdx = rest[0].slice(1).split("").map(Number); rest = rest.slice(1); }
    else if (rest.length>1 && /^[0-3]{3}$/.test(rest[0])){ rest = rest.slice(1); }  // ancien module : ignoré
    const name = decodeURIComponent(rest.join(".")||"");
    if (!/^[0-3]{12}$/.test(a) || !IDS.includes(D) || !IDS.includes(S) || D===S) return null;
    const answers = [];
    for (let i=0;i<6;i++){
      const plus=+a[i*2], minus=+a[i*2+1];
      if (plus===minus) return null;
      answers.push({plus, minus});
    }
    const s = computeScores(answers);
    const others = IDS.filter(id=>id!==D && id!==S).map(id=>s[id].score);
    if (others.some(v=>v > Math.min(s[D].score, s[S].score)) || s[S].score > s[D].score) return null;
    return {answers, core:[D,S], prenom:cleanName(name), lang, resourceIdx};
  }catch(e){ return null; }
}
const personalLink = (answers, core, prenom, lang, resourceIdx) => CONFIG.quizUrl+"#r="+encodeState(answers, core, prenom, lang, resourceIdx);

function manualText(p, lang){
  const X = L(lang).X, sep = lang==="fr" ? " : " : ": ";
  return X.manualHead(p)+"\n\n"+X.manualItems(p).map(([k,v])=>k+sep+v).join("\n");
}

/* ================================================================
   INTERFACE DU QUIZ (navigateur uniquement) · FR / EN
   ================================================================ */
const $ = sel => document.querySelector(sel);
const SCREENS = ["intro","quiz","tie","resources","gate","report"];
let current = "intro";
const GATE_FORM = document.getElementById("gate-form");
/* Personne qui passe le quiz. Invitation : ?inv=CODE&prenom=...&org=... */
const who = (()=>{
  let q; try{ q = new URLSearchParams(location.search); }catch(_){ q = new URLSearchParams(""); }
  const clip = v => String(v||"").replace(/[<>]/g,"").trim().slice(0,80);
  const inv = clip(q.get("inv")).replace(/[^A-Za-z0-9_-]/g,"").slice(0,24);
  return {prenom: clip(q.get("prenom")).slice(0,40), animal:"", inv, org: inv ? clip(q.get("org")) : "", resultSent:false};
})();
function show(name){ current = name; SCREENS.forEach(n=>$("#screen-"+n).hidden = n!==name); window.scrollTo({top:0}); }

/* ---------- Langue : même mémoire que le bouton FR/EN du site ---------- */
const LANG_KEY = "mh-lang";
let lang = (()=>{
  try{ const q = new URLSearchParams(location.search).get("lang"); if (q==="en"||q==="fr"||q==="es") return q; }catch(_){}
  try{ const v = localStorage.getItem("mh-quiz-lang"); if (v==="en"||v==="fr"||v==="es") return v; }catch(_){}
  try{ const v = localStorage.getItem(LANG_KEY); if (v==="en"||v==="fr") return v; }catch(_){}
  return "fr";
})();
const C = () => L(lang);
const T = () => C().X.T;
const get = (obj, path) => path.split(".").reduce((o,k)=>o&&o[k], obj);

function applyStatic(){
  document.documentElement.lang = lang;
  const inv = document.getElementById("invited");
  if (inv){ inv.hidden = !who.inv; if (who.inv) inv.textContent = T().intro.invited(who.org); }

  $("#rules").innerHTML = T().intro.rules.map(([k,h,p])=>`<div class="rule"><span class="k">${k}</span><strong>${h}</strong><p>${p}</p></div>`).join("");
  document.querySelectorAll("[data-setlang]").forEach(b=>{ const on = b.dataset.setlang===lang; b.classList.toggle("active", on); b.setAttribute("aria-pressed", on); });
}
document.querySelectorAll("[data-setlang]").forEach(b=>b.addEventListener("click", ()=>{
  lang = b.dataset.setlang;
  // Le site n'existe qu'en FR/EN : l'espagnol est mémorisé pour le quiz seulement.
  try{ localStorage.setItem("mh-quiz-lang", lang); if (lang!=="es") localStorage.setItem(LANG_KEY, lang); }catch(_){}
  applyStatic();
  if (current==="quiz") renderQuestion();
  if (current==="tie") renderTie();

  if (current==="gate" && pending) fillGate();

}));

/* ---------- État ---------- */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const displayOrder = QUESTION_IDS.map(q=>shuffle(q.map((_,i)=>i)));
let answers = QUESTION_IDS.map(()=>({plus:null,minus:null}));
let qi = 0, tieState = null, pending = null, lastReport = null, sendState = null;
let resourceAnswers = RESOURCE_QUESTIONS_FR.map(()=>null), resourcesPending = null;

/* ---------- Questions ---------- */
function renderQuestion(){
  const q = C().Q[qi], a = answers[qi], t = T().quiz;
  $("#progress").innerHTML = C().Q.map((_,i)=>`<span class="${i<=qi?'done':''}"></span>`).join("");
  $("#qcount").textContent = t.count(qi+1, C().Q.length);
  $("#qstem").textContent = q.stem;
  $("#items").innerHTML = displayOrder[qi].map(i=>{
    const isP=a.plus===i, isM=a.minus===i;
    return `<div class="item ${isP?'is-plus':''} ${isM?'is-minus':''}">
      <div class="txt">${q.items[i][1]}</div>
      <div class="choices" role="group" aria-label="${t.ariaGroup}">
        <button class="choice plus" id="q${qi}-p${i}" data-i="${i}" data-k="plus" aria-pressed="${isP}" aria-label="${t.ariaPlus}">+<small>${t.plusSmall}</small></button>
        <button class="choice minus" id="q${qi}-m${i}" data-i="${i}" data-k="minus" aria-pressed="${isM}" aria-label="${t.ariaMinus}">−<small>${t.minusSmall}</small></button>
      </div></div>`;
  }).join("");
  const ok = a.plus!=null && a.minus!=null;
  $("#next").disabled = !ok;
  $("#next").textContent = qi===C().Q.length-1 ? t.last : t.next;
  $("#hint").textContent = ok ? "" : (a.plus==null && a.minus==null ? t.hintBoth : a.plus==null ? t.hintPlus : t.hintMinus);
}
$("#items").addEventListener("click", e=>{
  const b = e.target.closest(".choice"); if(!b) return;
  const i = +b.dataset.i, k = b.dataset.k, other = k==="plus"?"minus":"plus";
  const a = answers[qi];
  a[k] = a[k]===i ? null : i;
  if (a[other]===i) a[other] = null;
  renderQuestion();
  const again = document.getElementById(b.id); if (again) again.focus();
});
$("#next").addEventListener("click", ()=>{
  if (qi < C().Q.length-1){ qi++; renderQuestion(); window.scrollTo({top:0}); }
  else finish();
});
$("#prev").addEventListener("click", ()=>{ if (qi>0){ qi--; renderQuestion(); } else show("intro"); });
$("#start").addEventListener("click", ()=>{
  const prenom = cleanName($("#h-prenom").value);
  if (!prenom){ $("#h-err").textContent = T().intro.nameErr; $("#h-prenom").focus(); return; }
  $("#h-err").textContent = "";
  who.prenom = prenom; who.animal = cleanName($("#h-animal").value);
  qi=0; renderQuestion(); show("quiz");
});
$("#demo").addEventListener("click", ()=>{
  answers = QUESTION_IDS.map(()=>{ const o=shuffle([0,1,2,3]); return {plus:o[0],minus:o[1]}; });
  const s = computeScores(answers), r = resolveCore(s);
  const core = [...r.fixed, ...(r.candidates||[])].slice(0,2);
  const p = buildProfile(s, core);
  p.resourceIdx = RESOURCE_QUESTIONS_FR.map(()=>Math.floor(Math.random()*4));
  renderReport(p, {prenom: lang==="en" ? "Alex" : lang==="es" ? "Lucía" : "Camille", core, demo:true});
});

function finish(){
  const s = computeScores(answers);
  const r = resolveCore(s);
  if (!r.candidates) return openResources(s, r.fixed);
  tieState = {s, fixed:r.fixed, candidates:r.candidates, need:r.need, picks:[]};
  renderTie(); show("tie");
}

/* ---------- Départage ---------- */
function renderTie(){
  const t = tieState, A = C().A;
  $("#tie-help").textContent = T().tie.help(t.fixed.length>0, t.need);
  $("#cands").innerHTML = t.candidates.map(id=>{
    const k = t.picks.indexOf(id);
    return `<button class="cand ${k>-1?'picked':''}" data-id="${id}" id="cand-${id}">
      ${k>-1?`<span class="rank">${t.fixed.length+k+1}</span>`:""}
      <strong>${A[id].name}</strong><span class="t">${A[id].tagline}</span><span>${A[id].essence}</span></button>`;
  }).join("");
  $("#tie-ok").disabled = t.picks.length < t.need;
}
$("#cands").addEventListener("click", e=>{
  const b = e.target.closest(".cand"); if(!b) return;
  const t = tieState, id=b.dataset.id;
  if (t.picks.includes(id) || t.picks.length>=t.need) return;
  t.picks.push(id);
  const left = t.candidates.filter(c=>!t.picks.includes(c));
  if (t.picks.length < t.need && left.length === 1) t.picks.push(left[0]);
  renderTie();
});
$("#tie-reset").addEventListener("click", ()=>{ tieState.picks=[]; renderTie(); });
$("#tie-ok").addEventListener("click", ()=>{ const t = tieState; openResources(t.s, [...t.fixed, ...t.picks].slice(0,2)); });

/* ---------- Ressourcement ---------- */
function openResources(s, core){
  resourcesPending = {s, core};
  resourceAnswers = C().RQ.map(()=>null);
  renderResources();
  show("resources");
}
function renderResources(){
  const rq = C().RQ, t = T().resources;
  $("#resource-questions").innerHTML = rq.map((q,qi)=>`
    <div class="rsrc-q">
      <div class="qstem">${qi+C().Q.length+1}. ${esc(q.stem)}</div>
      ${q.note?`<p class="muted rsrc-note">${esc(q.note)}</p>`:""}
      <div class="items">
        ${q.options.map((opt,oi)=>`<button type="button" class="rsrc-opt ${resourceAnswers[qi]===oi?'picked':''}" data-qi="${qi}" data-oi="${oi}" aria-pressed="${resourceAnswers[qi]===oi}">${esc(opt)}</button>`).join("")}
      </div>
    </div>`).join("");
  const ok = resourceAnswers.every(a=>a!=null);
  $("#resources-next").disabled = !ok;
  $("#resources-hint").textContent = ok ? "" : t.hint;
}
$("#resource-questions").addEventListener("click", e=>{
  const b = e.target.closest(".rsrc-opt"); if(!b) return;
  resourceAnswers[+b.dataset.qi] = +b.dataset.oi;
  renderResources();
});
$("#resources-next").addEventListener("click", ()=>{
  if (resourceAnswers.some(a=>a==null)) return;
  openGate(resourcesPending.s, resourcesPending.core);
});
$("#resources-back").addEventListener("click", ()=>{
  show(tieState && tieState.candidates ? "tie" : "quiz");
});

/* ---------- Capture e-mail ---------- */
function openGate(s, core){
  const p = buildProfile(s, core);
  p.resourceIdx = resourceAnswers.slice();
  pending = {p, core};
  $("#gate-err").textContent = "";
  renderReport(p, {core, prenom: who.prenom, animal: who.animal, locked: !!CONFIG.emailGate});
  sendResult(p, core);
}
function fillGate(){
  const {p} = pending, A = C().A;
  $("#gate-alloy").textContent = alloyName(p, lang);
  $("#gate-gift").textContent = `${A[p.D].gift}.`;
  $("#gate-fertile").textContent = `${lc1(A[p.D].fertile[0])}${T().gate.and}${lc1(A[p.S].fertile[0])}.`;
}
$("#gate-form").addEventListener("submit", e=>{
  e.preventDefault();
  const g = T().gate;
  const prenom = cleanName($("#f-prenom").value);
  const email = $("#f-email").value.trim().toLowerCase();
  if (!prenom){ $("#gate-err").textContent = g.errPrenom; $("#f-prenom").focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ $("#gate-err").textContent = g.errEmail; $("#f-email").focus(); return; }
  const {p, core} = pending;
  const state = encodeState(answers, core, prenom, lang, p.resourceIdx);
  try { history.replaceState(null, "", location.pathname+"#r="+state); } catch(_){}
  const newsletter = GATE_FORM.querySelector("#f-news").checked, website = GATE_FORM.querySelector("#f-website").value;
  renderReport(p, {prenom, email, core, animal: who.animal});
  if (CONFIG.emailGate){ const s5 = document.getElementById("s5"); if (s5) s5.scrollIntoView(); }
  sendReport({prenom, email, state, lang, newsletter, website});
});

// Invités : le résultat part automatiquement dans le Google Sheet de Pierre (onglet « Invités »).
function sendResult(p, core){
  if (!who.inv || who.resultSent || !CONFIG.endpoint) return;
  who.resultSent = true;
  const data = {type:"result", inv:who.inv, org:who.org, prenom:who.prenom, animal:who.animal, lang,
                state: encodeState(answers, core, who.prenom, lang, p.resourceIdx)};
  fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data)}).catch(()=>{ who.resultSent = false; });
}

// sendState = {k:"off"|"sending"|"sent"|"fail", email}
function statusHTML(ctx){
  const r = T().r;
  if (ctx.demo) return {cls:"status", txt:r.stDemo};
  if (!sendState) return {cls:"status", txt:r.stIdle};
  const m = {off:["status",r.stOff], sending:["status",r.stSending(sendState.email)], sent:["status ok",r.stSent(sendState.email)], fail:["status ko",r.stFail]}[sendState.k];
  return {cls:m[0], txt:m[1]};
}
function paintStatus(){
  const st = $("#send-status"); if (!st || !lastReport) return;
  const h = statusHTML(lastReport.ctx); st.className = h.cls; st.textContent = h.txt;
}
async function sendReport(data){
  if (!CONFIG.endpoint){ sendState = {k:"off"}; paintStatus(); return; }
  sendState = {k:"sending", email:data.email}; paintStatus();
  try{
    const res = await fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data)});
    const out = await res.json();
    if (!out.ok) throw new Error(out.error||"refus");
    sendState = {k:"sent", email:data.email};
  }catch(err){
    sendState = {k:"fail", email:data.email};
  }
  paintStatus();
}

/* ---------- Rapport ---------- */
function chartHTML(p){
  const A = C().A, MIN=-3, MAX=6, span=MAX-MIN, z=(0-MIN)/span*100;
  const rows = p.sorted.map(id=>{
    const v=p.scores[id].score, top=(id===p.D||id===p.S), ax=id===p.axis;
    const left = v>=0 ? z : (v-MIN)/span*100, width = Math.abs(v)/span*100;
    return `<div class="bar-row"><span class="n ${top?'top':''}">${A[id].name}</span>
      <div class="bar-track"><div class="bar ${top?'top':ax?'axis':''}" style="left:${left}%;width:${width}%"></div><div class="bar-zero" style="left:${z}%"></div></div>
      <span class="v">${v>0?'+':''}${v}</span></div>`;
  }).join("");
  return `<div class="chart" role="img" aria-label="${T().r.scores}">${rows}
    <div class="chart-scale"><span></span><div><span>−3</span><span>0</span><span>+6</span></div><span></span></div></div>`;
}
const li = arr => arr.map(x=>`<li>${x}</li>`).join("");

    <div class="panel"><span class="lab">${R.scores}</span>${chartHTML(p)}</div>
    <details><summary>${R.howSummary}</summary><div><p>${R.how1}</p><p>${R.how2}</p></div></details>
  </section>

  <section class="rs" id="s2">
    <span class="snum">${R.section(2)}</span><h2>${R.titles[1]}</h2>
    <p class="prose">${R.shipIntro}</p>
    <div class="ship">
      <div class="panel"><span class="lab">${R.hullLab}</span><h3>${R.hullH}</h3><p><strong>${d.name} × ${s.name}</strong></p><p>${esc(r.core)}</p></div>
      <div class="panel sail"><span class="lab">${R.sailLab}</span><h3>${R.sailH}</h3>
        ${p.expansion.length?`<p>${p.expansion.map(id=>`<strong>${A[id].name}</strong> (${A[id].tagline})`).join(R.and)}</p>`:""}<p>${r.expansion}</p></div>
      <div class="panel comp"><span class="lab">${R.compassLab}</span><h3>${R.compassH}</h3><p><strong>${ax.name}</strong> (${ax.tagline})</p><p>${r.axis}</p></div>
    </div>
  </section>

  <section class="rs" id="s3">
    <span class="snum">${R.section(3)}</span><h2>${R.titles[2]}</h2>
    <div class="stack">
      <div class="panel"><span class="lab">${R.giftLab}</span><p class="quote">${r.gift}</p><p>${r.giftColor}</p></div>
      <div class="panel"><span class="lab">${R.vulnLab}</span><p>${r.vuln}</p><p>${r.fracture}</p></div>
      <div class="panel"><span class="lab">${R.survLab}</span><h3>${d.survival.mode}</h3><p>${d.survival.desc}</p>
        <p class="muted">${r.survivalAlt}</p><p>${R.takeaway}</p></div>
    </div>
  </section>

  <section class="rs" id="s4">
    <span class="snum">${R.section(4)}</span><h2>${R.titles[3]}</h2>
    <div class="grid2">
      <div class="panel ctx-good"><span class="lab"><span class="dot g"></span>${R.fertileLab}</span><ul class="clean">${li(r.fertile)}</ul></div>
      <div class="panel ctx-bad"><span class="lab"><span class="dot r"></span>${R.toxicLab}</span><ul class="clean">${li(r.toxic)}</ul><p>${R.alert(d.survival.mode)}</p></div>
    </div>
    <div class="prose"><p>${R.energy}</p></div>
    ${r.recharge ? `
    <div class="panel"><span class="lab">${R.flowLab}</span><ul class="clean">${li(r.flow)}</ul></div>
    <div class="panel equation recharge">
      <span class="lab">${r.recharge.lab}</span>
      <h3>${esc(r.recharge.title)}</h3>
      <p>${esc(r.recharge.desc)}</p>
      <p><strong>${r.recharge.trapLab} ${esc(r.recharge.trapName)}.</strong> ${esc(r.recharge.trapText)}</p>
      <p><strong>${r.recharge.actsLab}</strong></p>
      <ul class="clean">${li(r.recharge.acts.map(esc))}</ul>
    </div>` : `
    <div class="grid2">
      <div class="panel"><span class="lab">${R.flowLab}</span><ul class="clean">${li(r.flow)}</ul></div>
      <div class="panel"><span class="lab">${R.resLab}</span><ul class="clean">${li(r.ressource)}</ul></div>
    </div>`}
  </section>
  ${ctx.locked ? `
  <section class="rs unlock" id="unlock">
    <span class="snum">${T().gate.lockEyebrow}</span><h2>${T().gate.lockH}</h2>

  </section>` : `
  <section class="rs" id="s5">
    <span class="snum">${R.section(5)}</span><h2>${R.titles[4]}</h2>
    <div class="grid3">
      <div class="panel"><span class="lab">${R.bossLab}</span><p>${d.targets.boss}.</p></div>

      <div class="panel"><span class="lab">${R.clientLab}</span><p>${r.client}</p></div>
    </div>
    <div class="panel">
      <span class="lab">${R.secretLab}</span>
      <p>${R.secretIntro}</p>
      <ul class="clean">${li(r.verbatims.map(q))}</ul>
      <p>${R.verbsIntro}</p>
      <div class="chips">${r.keywords.map(k=>`<span class="chip">${k}</span>`).join("")}</div>
    </div>
    <div class="stack">

    </div>
  </section>

  <section class="rs" id="s6">
    <span class="snum">${R.section(6)}</span><h2>${R.titles[5]}</h2>
    <p class="prose">${R.manualIntro}</p>
    <div class="manual">
      <span class="eyebrow">${R.manualLab}</span>
      <h3>${X.alloyName(p)}</h3>
      <dl>${X.manualItems(p).map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </div>
    <textarea id="manual-text" hidden>${esc(manualText(p, lang))}</textarea>
    <div class="row-actions"><button class="btn ghost small" data-copy="manual-text">${R.copyManual}</button><span class="toast" id="toast-manual-text" aria-live="polite"></span></div>
  </section>

  <section class="rs" id="s7">

      ${["ctx","exp","fin"].map((k,i)=>`<div class="slider"><label for="sl-${k}">${R.sliders[i]} <output id="o-${k}">5</output></label><input type="range" id="sl-${k}" min="0" max="10" value="5"></div>`).join("")}

    <div class="cta">
      <span class="eyebrow">${R.ctaEyebrow}</span>
      <h3>${R.ctaH}</h3>
      <p>${R.ctaP(X.alloyName(p))}</p>
      <div class="cta-actions">
        <a class="btn" href="${CONFIG.calendly}" target="_blank" rel="noopener" data-cta-place="quiz_resultat">${R.ctaBtn}</a>

          <a class="btn ghost small" data-share="${k}" data-via="wa" href="#" target="_blank" rel="noopener">${R.shareWa}</a>

          <a class="btn ghost small" data-share="${k}" data-via="mail" href="#">${R.shareMail}</a>
          <button class="btn ghost small" type="button" data-share="${k}" data-via="copy">${R.shareCopy}</button>
          <button class="btn ghost small" type="button" data-share="${k}" data-via="native" hidden>${R.shareMore}</button>
          <span class="toast" id="toast-share-${k}" aria-live="polite"></span>
        </div></div>`).join("")}

    try { await navigator.clipboard.writeText(text); flash(toastId, T().r.copied); }
    catch(e){ if (fallbackEl){ fallbackEl.hidden=false; fallbackEl.focus(); fallbackEl.select(); } flash(toastId, T().r.copyFallback); }
  }
  root.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click", ()=>{
    const id = btn.dataset.copy, ta = document.getElementById(id);
    copy(ta.value, "toast-"+id, ta);

  if (link) $("#copy-link").addEventListener("click", ()=>copy(link, "toast-act"));

  // Partage : WhatsApp, e-mail, copie, et partage natif du téléphone si disponible

    quiz: {url: quizUrl, subject: R.shareQuizSubject, text: R.shareQuizText(quizUrl)},

    if (via==="wa") el.href = "https://wa.me/?text=" + encodeURIComponent(sd.text);
    if (via==="gmail") el.href = "https://mail.google.com/mail/?view=cm&fs=1&su=" + encodeURIComponent(sd.subject) + "&body=" + encodeURIComponent(sd.text);
    if (via==="mail") el.href = "mailto:?subject=" + encodeURIComponent(sd.subject) + "&body=" + encodeURIComponent(sd.text);
    if (via==="copy") el.addEventListener("click", ()=>copy(sd.text, "toast-share-"+el.dataset.share));
    if (via==="native" && navigator.share){
      el.hidden = false;
      el.addEventListener("click", ()=>{ navigator.share({title: sd.subject, text: sd.text}).catch(()=>{}); });
    }
  });

  $("#dl-pdf").addEventListener("click", async ()=>{
    const btn = $("#dl-pdf"), R2 = T().r;
    if (!window.html2pdf){ flash("toast-act", R2.pdfNoLib); return; }
    btn.disabled = true; btn.textContent = R2.pdfBusy;
    try{
      await html2pdf().set({
        margin:[14,14,16,14], filename:`${R2.pdfName}-${(prenom||"rapport").replace(/[^\p{L}\p{N}-]+/gu,"-")}.pdf`,
        image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2, backgroundColor:"#FFFFFF"},
        jsPDF:{unit:"mm", format:"a4", orientation:"portrait"}, pagebreak:{mode:["css","legacy"], avoid:".avoid"}
      }).from(reportDocHTML(p, prenom, link, lang)).save();
    }catch(e){ flash("toast-act", R2.pdfFail); }
    btn.disabled = false; btn.textContent = R2.pdf;
  });

  const sl = {ctx:$("#sl-ctx"), exp:$("#sl-exp"), fin:$("#sl-fin")};
  const update = ()=>{
    const v = {ctx:+sl.ctx.value, exp:+sl.exp.value, fin:+sl.fin.value};
    Object.keys(v).forEach(k=>$("#o-"+k).textContent=v[k]);
    $("#reading").innerHTML = X.readAlignment(v, p);
  };
  Object.values(sl).forEach(x=>x.addEventListener("input", update));
  update();

  $("#restart").addEventListener("click", ()=>{
    answers = QUESTION_IDS.map(()=>({plus:null,minus:null})); qi=0; tieState=null; pending=null; lastReport=null; sendState=null;
    resourceAnswers = C().RQ.map(()=>null); resourcesPending=null;
    try { history.replaceState(null, "", location.pathname); } catch(_){}
    show("intro");
  });
}

/* ---------- Démarrage ---------- */
(function boot(){
  const m = location.hash.match(/^#r=(.+)$/);
  const st = m ? decodeState(m[1]) : null;
  if (st && !new URLSearchParams(location.search).get("lang")) lang = st.lang;
  applyStatic();
  if (who.prenom) $("#h-prenom").value = who.prenom;
  if (st){
    answers = st.answers;
    const p = buildProfile(computeScores(answers), st.core);
    if (st.resourceIdx) p.resourceIdx = st.resourceIdx;
    renderReport(p, {prenom:st.prenom, core:st.core});
  }
})();
