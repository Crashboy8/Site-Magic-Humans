<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Photo de la salle | Magic Humans</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<style>
:root{--bg:#F5F3F0;--ink:#2B2522;--muted:#6E645D;--line:#E4DED7;--accent:#D9661C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 48px}
.eyebrow{font-size:.95rem;letter-spacing:.04em;color:var(--accent);font-weight:700}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1;margin:8px 0 12px}
.total{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;margin:0 0 22px}
.note{font-size:1.35rem;margin:0 0 18px}
.row{display:grid;grid-template-columns:minmax(140px,220px) 1fr auto;gap:16px;align-items:center;margin:14px 0}
.lab{font-weight:700;font-size:1.35rem;color:var(--bf)}
.track{height:36px;background:var(--line);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--bf);border-radius:999px}
.pct{font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.quiet{color:var(--muted)}
@media (max-width:640px){
  .row{grid-template-columns:1fr auto}
  .track{grid-column:1 / -1;order:3}
}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow" id="session"></p>
  <h1>Photo de la salle</h1>
  <p class="total" id="total"></p>
  <p class="note" id="note"></p>
  <div id="bars"></div>
</main>
<script src="/quiz/amour-data.js"></script>
<script src="/quiz/amour-engine.js"></script>
<script>
(function () {
  var E = window.AmourEngine;
  var D = window.AMOUR_DATA;
  var note = document.getElementById("note");
  var total = document.getElementById("total");
  var bars = document.getElementById("bars");
  var eyebrow = document.getElementById("session");
  var params = new URLSearchParams(location.search);
  var session = params.get("session") || "";
  var dernier = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function montrer(photo) {
    total.textContent = photo.total + (photo.total === 1 ? " participant" : " participants");
    if (photo.total < 5) {
      bars.innerHTML = "";
      note.textContent = "La photo s'affiche dès 5 participants.";
      return;
    }
    note.textContent = "";
    bars.innerHTML = photo.bars.map(function (bar) {
      return '<div class="row" style="--bf:' + esc(bar.color) + '"><div class="lab">' + esc(bar.name) + '</div><div class="track"><i style="width:' + bar.pct + '%"></i></div><div class="pct">' + esc(String(bar.pct)) + " %</div></div>";
    }).join("");
  }

  function attendre(message) {
    if (dernier) return;
    total.textContent = "";
    bars.innerHTML = "";
    note.textContent = message;
  }

  function charger() {
    if (document.visibilityState === "hidden") return;
    fetch("/boussole-decision/api/quiz-salle/?session=" + encodeURIComponent(session), { credentials: "omit" })
      .then(function (res) { return res && res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || data.ok !== true || !Array.isArray(data.profils)) {
          attendre("La photo n'est pas disponible pour le moment.");
          return;
        }
        dernier = data;
        montrer(E.sallePhoto("", data.profils, D));
      })
      .catch(function () { attendre("La photo n'est pas disponible pour le moment."); });
  }

  if (!E || !D || !E.salleSessionOk(session)) {
    eyebrow.textContent = "";
    attendre("Ajoute ?session=webinaire-8oct à l'adresse.");
    return;
  }
  eyebrow.textContent = session;
  charger();
  setInterval(charger, 10000);
})();
</script>
</body>
</html>
